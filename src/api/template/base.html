<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MarioFlix{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v={{ versao('style.css') }}">
</head>
<body>
  <nav class="nav">
    <a href="/" class="logo">MARIOFLIX</a>
    <div class="nav-links">
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Home</a>
      <a href="/filmes" class="{{ 'active' if request.url.path == '/filmes' else '' }}">Filmes</a>
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='app.js') }}?v={{ versao('app.js') }}" defer></script>
</body>
</html>
